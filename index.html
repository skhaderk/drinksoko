<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOKO Cocoa</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f28c28, #228B22);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      max-width: 1200px;
    }
    .image {
      flex: 1 1 300px;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    .image img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .text {
      flex: 1 1 300px;
      padding: 20px;
      text-align: center;
    }
    .text h1 {
      font-size: 3rem;
      margin: 0;
    }
    .text h2 {
      font-size: 2rem;
      margin: 10px 0;
    }
    .text p {
      font-size: 1.2rem;
      margin: 20px 0 0;
    }
    @media (max-width: 768px) {
      .text h1 { font-size: 2.2rem; }
      .text h2 { font-size: 1.6rem; }
      .text p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image">
      <img src="soko.png" alt="SOKO Cocoa Can">
    </div>
    <div class="text">
      <h1>SOKO</h1>
      <h2>Cocoa</h2>
      <p>Refreshing. Organic. Pure Cocoa Goodness.</p>
    </div>
  </div>
</body>
</html>
